function doGet() {
  const sheet = SpreadsheetApp.getActiveSpreadsheet().getActiveSheet();
  const data = sheet.getDataRange().getValues();
  if (data.length <= 1) return ContentService.createTextOutput(JSON.stringify([])).setMimeType(ContentService.MimeType.JSON);
  const headers = data[0];
  const result = [];
  for (let i = 1; i < data.length; i++) {
    let obj = {};
    headers.forEach((h, idx) => obj[h] = data[i][idx]);
    try { obj.images = JSON.parse(obj.images || '[]'); } catch(e){ obj.images = []; }
    result.push(obj);
  }
  return ContentService.createTextOutput(JSON.stringify(result)).setMimeType(ContentService.MimeType.JSON);
}

function doPost(e) {
  const sheet = SpreadsheetApp.getActiveSpreadsheet().getActiveSheet();
  if (sheet.getLastRow() === 0) {
    sheet.appendRow(['id','title','content','category','categoryColor','images','createdAt','updatedAt','isDone']);
  }
  const payload = JSON.parse(e.postData.contents);
  if (payload.action === 'clear') {
    sheet.clear(); 
    sheet.appendRow(['id','title','content','category','categoryColor','images','createdAt','updatedAt','isDone']);
    return ContentService.createTextOutput(JSON.stringify({ok:true})).setMimeType(ContentService.MimeType.JSON);
  }
  if (payload.action === 'save_all') {
    sheet.clear();
    sheet.appendRow(['id','title','content','category','categoryColor','images','createdAt','updatedAt','isDone']);
    payload.memos.forEach(m => {
      sheet.appendRow([
        m.id, m.title, m.content, m.category, m.categoryColor,
        JSON.stringify((m.images||[]).slice(0,3)),
        m.createdAt, m.updatedAt, m.isDone
      ]);
    });
  }
  return ContentService.createTextOutput(JSON.stringify({ok:true, count: payload.memos.length})).setMimeType(ContentService.MimeType.JSON);
